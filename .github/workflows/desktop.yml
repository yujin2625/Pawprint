name: Desktop release

# Pushing a tag app-v<version> (the version in web/src-tauri/tauri.conf.json) builds the desktop app for Windows,
# macOS and Linux and puts the installers in a draft release to check and publish by hand.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - run: npm ci
        working-directory: web
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          tagName: app-v__VERSION__
          releaseName: Pawprint __VERSION__
          releaseBody: Desktop app. The installers are not code-signed, so Windows SmartScreen and macOS Gatekeeper warn on first start.
          releaseDraft: true
          args: ${{ matrix.args }}
